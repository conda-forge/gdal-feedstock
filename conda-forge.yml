build_platform:
  linux_ppc64le: linux_64
conda_build:
  pkg_format: '2'
conda_build_tool: rattler-build
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux: azure
  linux_aarch64: default
  linux_ppc64le: azure
  osx: azure
  osx_arm64: default
  win: azure
test: native_and_emulated
workflow_settings:
  build_workspace_dir:
  - os: win
    provider: azure
    value: D:\bld\
  tools_install_dir:
  - os: win
    provider: azure
    value: C:\Miniforge
